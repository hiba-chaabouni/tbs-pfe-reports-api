$kind: http-request
description: Public route, no token. Test checks that 'student_id' appears NOWHERE in the response.
url: "{{base_url}}/reports"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 200", function () { expect(pm.response.code).to.eql(200); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("PRIVACY: no student_id in public response", function () { expect(JSON.stringify(j)).to.not.include("student_id"); });
      pm.test("Returns 9 seed reports", function () { expect(j.count).to.eql(9); });
    language: text/javascript
order: 1000
