$kind: http-request
name: E17 405 - PATCH /students/<id>
url: "{{base_url}}/students/11165247"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 405", function () { expect(pm.response.code).to.eql(405); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(405); });
    language: text/javascript
order: 18000
