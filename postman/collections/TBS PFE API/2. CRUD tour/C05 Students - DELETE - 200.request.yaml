$kind: http-request
name: C05 Students - DELETE -> 200
description: Allowed because Rania has no reports.
url: "{{base_url}}/students/10203040"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 200", function () { expect(pm.response.code).to.eql(200); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
    language: text/javascript
order: 6000
