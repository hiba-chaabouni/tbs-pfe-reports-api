$kind: http-request
name: D09 Retry GET /students -> 200
url: "{{base_url}}/students"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 200", function () { expect(pm.response.code).to.eql(200); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
    language: text/javascript
order: 9000
