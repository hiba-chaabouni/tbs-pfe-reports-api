$kind: http-request
name: C10 Reports - PUT -> 200
description: Full update. report_id comes from the URL; major and date must still match it.
url: "{{base_url}}/reports/TBS-PFE-2025-IT-030"
method: PUT
body:
  type: json
  content: |-
    {
      "student_id": "11937402",
      "major": "IT",
      "title": "AI Chatbot for Student Services: Case of Tunis Business School",
      "type": "Internship report",
      "key_feature_1": "Natural language processing",
      "key_feature_2": "Flask REST API",
      "key_feature_3": "Usability testing",
      "date": "2025-06-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 200", function () { expect(pm.response.code).to.eql(200); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("PRIVACY: no student_id in public response", function () { expect(JSON.stringify(j)).to.not.include("student_id"); });
      pm.test("Title updated", function () { expect(j.title).to.include('AI Chatbot'); });
    language: text/javascript
order: 11000
