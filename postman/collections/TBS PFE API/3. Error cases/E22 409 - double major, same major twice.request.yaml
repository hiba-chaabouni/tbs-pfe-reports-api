$kind: http-request
description: "Skander (from the setup requests): double major with exactly 1 report, in BA."
url: "{{base_url}}/reports"
method: POST
body:
  type: json
  content: |-
    {
      "report_id": "TBS-PFE-2025-BA-053",
      "student_id": "15937486",
      "major": "BA",
      "title": "Customer Lifetime Value Modeling: Case of a Tunisian E-commerce Platform",
      "type": "Internship report",
      "key_feature_1": "Machine learning",
      "key_feature_2": "Customer segmentation",
      "key_feature_3": "Python (pandas)",
      "date": "2025-06-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 409", function () { expect(pm.response.code).to.eql(409); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(409); });
      pm.test("Message mentions: different majors", function () { expect(j.message).to.include("different majors"); });
    language: text/javascript
order: 25000
