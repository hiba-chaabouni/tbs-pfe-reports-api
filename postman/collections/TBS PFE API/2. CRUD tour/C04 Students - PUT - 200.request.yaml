$kind: http-request
name: C04 Students - PUT -> 200
description: Full update. student_id comes from the URL and cannot change.
url: "{{base_url}}/students/10203040"
method: PUT
body:
  type: json
  content: |-
    {
      "first_name": "Rania",
      "last_name": "Ben Ammar",
      "double_major": 1,
      "level": "senior"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 200", function () { expect(pm.response.code).to.eql(200); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Level updated", function () { expect(j.level).to.eql('senior'); });
      pm.test("double_major updated", function () { expect(j.double_major).to.eql(1); });
    language: text/javascript
order: 5000
