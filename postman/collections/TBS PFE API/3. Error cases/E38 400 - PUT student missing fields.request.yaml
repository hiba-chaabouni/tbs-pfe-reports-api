$kind: http-request
url: "{{base_url}}/students/11165247"
method: PUT
body:
  type: json
  content: |-
    {
      "level": "senior"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 400", function () { expect(pm.response.code).to.eql(400); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(400); });
      pm.test("Message mentions: Missing required field", function () { expect(j.message).to.include("Missing required field"); });
    language: text/javascript
order: 41000
