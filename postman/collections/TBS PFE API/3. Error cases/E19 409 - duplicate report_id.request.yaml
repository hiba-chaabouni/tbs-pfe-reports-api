$kind: http-request
url: "{{base_url}}/reports"
method: POST
body:
  type: json
  content: |-
    {
      "report_id": "TBS-PFE-2024-BA-017",
      "student_id": "11165247",
      "major": "BA",
      "title": "Design of a Customer Churn Prediction Model: Case of a Tunisian Telecom Operator",
      "type": "Internship report",
      "key_feature_1": "Machine learning",
      "key_feature_2": "Customer segmentation",
      "key_feature_3": "Python (scikit-learn)",
      "date": "2024-06-20"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 409", function () { expect(pm.response.code).to.eql(409); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(409); });
      pm.test("Message mentions: already exists", function () { expect(j.message).to.include("already exists"); });
    language: text/javascript
order: 20000
