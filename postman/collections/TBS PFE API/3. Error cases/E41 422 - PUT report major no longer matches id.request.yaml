$kind: http-request
url: "{{base_url}}/reports/TBS-PFE-2024-BA-017"
method: PUT
body:
  type: json
  content: |-
    {
      "student_id": "11165247",
      "major": "FIN",
      "title": "Design of a Customer Churn Prediction Model: Case of a Tunisian Telecom Operator",
      "type": "Internship report",
      "key_feature_1": "Machine learning",
      "key_feature_2": "Customer segmentation",
      "key_feature_3": "Python (scikit-learn)",
      "date": "2024-06-20"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 422", function () { expect(pm.response.code).to.eql(422); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(422); });
      pm.test("Message mentions: does not match 'major'", function () { expect(j.message).to.include("does not match 'major'"); });
    language: text/javascript
order: 44000
