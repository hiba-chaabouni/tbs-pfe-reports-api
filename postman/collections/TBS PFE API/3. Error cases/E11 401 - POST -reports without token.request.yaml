$kind: http-request
name: E11 401 - POST /reports without token
url: "{{base_url}}/reports"
method: POST
body:
  type: json
  content: |-
    {
      "report_id": "TBS-PFE-2025-IT-030",
      "student_id": "11937402",
      "major": "IT",
      "title": "Chatbot for Student Services: Case of Tunis Business School",
      "type": "Internship report",
      "key_feature_1": "NLP",
      "key_feature_2": "Flask API",
      "key_feature_3": "User testing",
      "date": "2025-06-01"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 401", function () { expect(pm.response.code).to.eql(401); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(401); });
      pm.test("Message mentions: Missing token", function () { expect(j.message).to.include("Missing token"); });
    language: text/javascript
order: 12000
