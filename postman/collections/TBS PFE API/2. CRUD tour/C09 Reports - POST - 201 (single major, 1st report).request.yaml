$kind: http-request
name: C09 Reports - POST -> 201 (single major, 1st report)
description: "Ranim: single major, no report yet. Response has no student_id."
url: "{{base_url}}/reports"
method: POST
body:
  type: json
  content: |-
    {
      "report_id": "TBS-PFE-2025-IT-030",
      "student_id": "11937402",
      "major": "IT",
      "title": "Chatbot for Student Services: Case of Tunis Business School",
      "type": "Internship report",
      "key_feature_1": "NLP",
      "key_feature_2": "Flask API",
      "key_feature_3": "User testing",
      "date": "2025-06-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 201", function () { expect(pm.response.code).to.eql(201); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("PRIVACY: no student_id in public response", function () { expect(JSON.stringify(j)).to.not.include("student_id"); });
    language: text/javascript
order: 10000
