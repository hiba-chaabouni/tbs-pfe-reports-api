$kind: http-request
description: "Youssef: single major, already 1 report."
url: "{{base_url}}/reports"
method: POST
body:
  type: json
  content: |-
    {
      "report_id": "TBS-PFE-2025-MKT-051",
      "student_id": "08264519",
      "major": "MKT",
      "title": "Go-to-Market Strategy for a Tunisian Fintech Startup",
      "type": "Entrepreneurial project",
      "key_feature_1": "Market research",
      "key_feature_2": "Pricing strategy",
      "key_feature_3": "Digital marketing",
      "date": "2025-06-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 409", function () { expect(pm.response.code).to.eql(409); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(409); });
      pm.test("Message mentions: double_major = 0", function () { expect(j.message).to.include("double_major = 0"); });
    language: text/javascript
order: 21000
