$kind: http-request
name: "E23 422 - student: many invalid values"
url: "{{base_url}}/students"
method: POST
body:
  type: json
  content: |-
    {
      "student_id": "1234",
      "first_name": "R4n!a",
      "last_name": "X",
      "double_major": 3,
      "level": "master"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 422", function () { expect(pm.response.code).to.eql(422); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(422); });
      pm.test("Message mentions: double_major", function () { expect(j.message).to.include("double_major"); });
    language: text/javascript
order: 26000
