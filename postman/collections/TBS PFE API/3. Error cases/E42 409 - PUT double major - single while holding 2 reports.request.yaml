$kind: http-request
name: E42 409 - PUT double major -> single while holding 2 reports
description: Aziz has 2 reports, so he cannot become single major.
url: "{{base_url}}/students/09876543"
method: PUT
body:
  type: json
  content: |-
    {
      "first_name": "Mohamed Aziz",
      "last_name": "Trabelsi",
      "double_major": 0,
      "level": "senior"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 409", function () { expect(pm.response.code).to.eql(409); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(409); });
      pm.test("Message mentions: cannot be set to 0", function () { expect(j.message).to.include("cannot be set to 0"); });
    language: text/javascript
order: 45000
