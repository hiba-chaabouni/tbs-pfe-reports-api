$kind: http-request
url: "{{base_url}}/students/00000000"
method: PUT
body:
  type: json
  content: |-
    {
      "first_name": "Rania",
      "last_name": "Ben Ammar",
      "double_major": 1,
      "level": "senior"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 404", function () { expect(pm.response.code).to.eql(404); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(404); });
    language: text/javascript
order: 39000
