$kind: http-request
url: "{{base_url}}/students/11165247"
method: PUT
body:
  type: json
  content: |-
    {
      "first_name": "Yasmine",
      "last_name": "Ben Salah",
      "double_major": 0,
      "level": "master"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 422", function () { expect(pm.response.code).to.eql(422); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(422); });
      pm.test("Message mentions: 'level' must be one of", function () { expect(j.message).to.include("'level' must be one of"); });
    language: text/javascript
order: 42000
