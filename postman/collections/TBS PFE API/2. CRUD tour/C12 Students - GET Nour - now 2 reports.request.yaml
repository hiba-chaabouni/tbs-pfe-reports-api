$kind: http-request
name: C12 Students - GET Nour -> now 2 reports
url: "{{base_url}}/students/14820367"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 200", function () { expect(pm.response.code).to.eql(200); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Nour has 2 reports", function () { expect(j.reports.length).to.eql(2); });
    language: text/javascript
order: 13000
