$kind: http-request
url: "{{base_url}}/reports"
method: POST
body:
  type: json
  content: |-
    [
      1,
      2,
      3
    ]
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 400", function () { expect(pm.response.code).to.eql(400); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(400); });
      pm.test("Message mentions: JSON object", function () { expect(j.message).to.include("JSON object"); });
    language: text/javascript
order: 6000
