$kind: http-request
description: A report must always belong to a student.
url: "{{base_url}}/students/11165247"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 409", function () { expect(pm.response.code).to.eql(409); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(409); });
      pm.test("Message mentions: delete the report(s) first", function () { expect(j.message).to.include("delete the report(s) first"); });
    language: text/javascript
order: 47000
