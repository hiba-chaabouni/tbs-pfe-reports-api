$kind: http-request
name: D11 POST report with invalid data -> 422
description: Every problem is listed at once in the message, separated by |.
url: "{{base_url}}/reports"
method: POST
body:
  type: json
  content: |-
    {
      "report_id": "TBS-2024-17",
      "student_id": "11937402",
      "major": "LAW",
      "title": "Short",
      "type": "Blog post",
      "key_feature_1": "NLP",
      "key_feature_2": "Flask API",
      "key_feature_3": "User testing",
      "date": "2025-02-30"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const expect = pm.expect;
      let j = null;
      try { j = pm.response.json(); } catch (e) {}
      pm.test("Status is 422", function () { expect(pm.response.code).to.eql(422); });
      pm.test("Response is JSON", function () { expect(j).to.be.an("object"); });
      pm.test("Error format {error, message, status}", function () { expect(j).to.have.all.keys("error", "message", "status"); expect(j.status).to.eql(422); });
    language: text/javascript
order: 11000
